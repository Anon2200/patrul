<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Патруль: нет связи</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#e5edf7;font:16px system-ui,sans-serif}
main{max-width:420px;padding:24px;text-align:center}h1{font-size:22px;margin:0 0 10px}p{color:#a8b6c8;line-height:1.5}
button{margin-top:14px;padding:12px 22px;border:0;border-radius:10px;background:#1f8a7d;color:#fff;font:inherit;font-weight:600;cursor:pointer}</style></head>
<body><main><h1 id="t">Нет связи с сервером</h1><p id="d">Проверьте интернет и повторите попытку. Данные хранятся на сервере и после появления связи будут на месте.</p>
<button onclick="retry()">Повторить</button></main>
<script>
const q=new URLSearchParams(location.search);
if(q.get('reason')==='config'){document.getElementById('t').textContent='Не задан адрес сайта';document.getElementById('d').textContent='Укажите адрес в файле apps/app-config.json и пересоберите приложение.';}
function retry(){const u=q.get('url');if(u)location.href=u+'/';else location.reload();}
</script></body></html>
