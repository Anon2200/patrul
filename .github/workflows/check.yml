name: Patrul checks

on:
  push:
    branches:
      - feature/shared-data-center
      - shared-password-sync
  pull_request:
    branches:
      - main
      - feature/shared-data-center

permissions:
  contents: read

jobs:
  syntax-and-page-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run static checks
        run: npm run check
