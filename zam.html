 inn:{ev:sxIEv,tk:sxITk,st:sxISt}};
/* ===== ОБМЕН ПАКЕТАМИ МЕЖДУ РОЛЯМИ ===== */
const SXSEED=['Развод и инструктаж личного состава','Доклад педагогу-организатору об итогах службы','Проверка имущества патруля со старшим мастером','Обход постов','Проверка журналов патруля','Доклад начальнику патруля об итогах','Развод: отметить явку личного состава','Заполнить журнал службы за день','Недельный отчёт начальнику патруля','Передать материалы руководителю патруля'];
const sxSeedEv=v=>v.rec!='none'&&(SXSEED.includes(v.title)||String(v.note||'').startsWith('Время условное'));
let SXTXT='',SXNEW=new Set();
function sxS(){return D.sx||(D.sx={meta:{},in:{},seen:{},tOut:0,tIn:0})}
function sxStable(o){if(Array.isArray(o))return'['+o.map(sxStable).join(',')+']';if(o&&typeof o=='object')return'{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+sxStable(o[k])).join(',')+'}';return JSON.stringify(o)}
const sxD=s=>s?String(s).slice(8,10)+'.'+String(s).slice(5,7)+'.'+String(s).slice(0,4):'';
const sxDT=t=>t?new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'ещё не было';
function sxB64(b){let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function sxUn64(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
async function sxPack(o){const raw=new TextEncoder().encode(JSON.stringify(o));let z=null;try{z=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer())}catch(x){}
 return z&&z.length<raw.length?'ПАТРУЛЬ1Z:'+sxB64(z):'ПАТРУЛЬ1R:'+sxB64(raw)}
async function sxUnpack(s){const m=/ПАТРУЛЬ1([RZ]):([A-Za-z0-9_\-]+)/.exec(s);if(!m)throw 0;let b=sxUn64(m[2]);if(m[1]=='Z')b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());return JSON.parse(new TextDecoder().decode(b))}
function sxCollect(all){const S=sxS(),r=[],now=Date.now();SXC.out().forEach(it=>{const h=sxStable(it.d),m=S.meta[it.k];if(all||!m||m.h!=h)r.push({t:it.t,k:it.k,u:now,f:SXC.name,d:it.d,_h:h})});return r}
async function sxSend(all){const S=sxS(),it=sxCollect(all);if(!it.length)return toast('Нечего отправлять: после прошлой отправки изменений нет');
 const code=await sxPack({v:1,from:SXC.name,role:SXC.role,ts:Date.now(),items:it.map(({_h,...r})=>r)});
 SXTXT='Пакет обмена · '+SXC.name+' · '+sxDT(Date.now())+'\n(в программе: Обмен → Принять пакет)\n'+code;it.forEach(x=>S.meta[x.k]={h:x._h,u:x.u});S.tOut=Date.now();save();
 modal(`<h3>Пакет готов</h3><p class="mu" style="margin-top:0">Позиций: ${it.length}. Отправьте текст в общий чат патруля. Остальные нажмут «Принять пакет» и вставят его.</p><textarea readonly rows="4" style="width:100%;font-size:12px">${e(SXTXT)}</textarea><div class="bar" style="margin:12px 0 0"><button class="btn" style="flex:1" data-act="sxshare">Отправить</button><button class="btn g" style="flex:1" data-act="sxcopy">Копировать</button><button class="btn g" data-act="sxfile">Файл</button></div><div class="bar" style="margin:0"><button class="btn g" style="flex:1" data-act="sxcl">Готово</button></div>`);draw(1)}
async function sxApplyTxt(txt){let pk;try{pk=await sxUnpack(txt)}catch(x){return toast('Это не пакет обмена. Скопируйте сообщение целиком')}
 const S=sxS();let n=0;(pk.items||[]).forEach(it=>{if(!it||!it.k||!it.t)return;const m=S.meta[it.k];if(m&&m.u>=it.u)return;const ap=SXC.inn[it.t];let loc=null;if(ap)try{loc=ap(it.d,it)}catch(x){loc=null}
  if(loc){S.meta[it.k]={h:sxStable(loc),u:it.u}}else{(S.in[it.t]=S.in[it.t]||{})[it.k]={t:it.t,k:it.k,u:it.u,f:it.f||pk.from,d:it.d};S.meta[it.k]={h:'in',u:it.u}}n++});
 S.tIn=Date.now();save();closeM();draw(1);toast(n?'Принято записей: '+n+' (от: '+(pk.from||'?')+')':'Новых записей нет: всё уже принято')}
function sxUnread(){const S=sxS();let n=0;Object.values(S.in).forEach(o=>Object.values(o).forEach(x=>{if(S.seen[x.k]!=x.u)n++}));return n}
const SXTT={ou:'Документы на согласование',rp:'Доклады',mt:'Материалы о нарушениях',sh:'Итоги смены и явка',tk:'Поручения',ev:'События'};
function sxCard(t,x){const d=x.d||{},nw=SXNEW.has(x.k)?' <span class="tag b">новое</span>':'',fr=`${e(x.f||'')}`;let h='',s='',b='',a='';
 if(t=='rp'){h=d.type;s=sxD(d.d)+' '+(d.t||'')+' · '+fr+(d.st=='Доложено'?' · доложено':'');b=d.text;if(SXC.rpMat&&['Нарушение','Недостаток службы'].includes(d.type))a=`<button class="btn s" data-act="sxmat" data-k="${e(x.k)}">В журнал регистрации</button>`}
 else if(t=='mt'){h=(d.fio||'—')+(d.grp?' · '+d.grp:'');s=sxD(d.d)+' · '+(d.cat||'')+' · '+fr;b=[d.gist,d.res].filter(Boolean).join('. ')}
 else if(t=='sh'){h=(d.role||fr)+' · '+sxD(d.date);s='';b=(d.lines||[]).join('\n')}
 else if(t=='ou'){h=d.subj||d.kind;s=(d.kind||'')+' · '+sxD(d.d)+' · '+fr+' · статус: '+(d.st||'');b=d.text;if(SXC.approve)a=`<button class="btn s" data-act="sxou" data-k="${e(x.k)}" data-v="Согласовано">Согласовать</button><button class="btn s g" data-act="sxou" data-k="${e(x.k)}" data-v="На доработку">На доработку</button>`}
 else if(t=='tk'){h=d.text;s=(d.who||d.src||'')+(d.due?' · срок '+sxD(d.due):'')+' · '+(d.st||'');}
 else if(t=='ev'){h=(d.t?d.t+' ':'')+d.title;s=sxD(d.d)+' · '+fr}
 return`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>${e(h)}</b>${nw}</div>${s?`<div class="mu">${e(s)}</div>`:''}${b?`<div style="margin-top:6px;white-space:pre-line">${e(b)}</div>`:''}${a?`<div class="bar" style="margin:10px 0 0">${a}</div>`:''}</div>`}
function sxInbox(){const S=sxS();SXNEW=new Set();let h='';['ou','rp','mt','sh','tk','ev'].forEach(t=>{if(t=='ou'&&!SXC.approve)return;const a=Object.values(S.in[t]||{}).sort((x,y)=>y.u-x.u).slice(0,25);if(!a.length)return;a.forEach(x=>{if(S.seen[x.k]!=x.u)SXNEW.add(x.k)});h+=`<h3 style="margin:18px 0 8px">${SXTT[t]} <span class="mu">${a.length}</span></h3>`+a.map(x=>sxCard(t,x)).join('')});
 Object.values(S.in).forEach(o=>Object.values(o).forEach(x=>S.seen[x.k]=x.u));
 return h||'<div class="empty" style="margin-top:14px">Входящих пока нет. Здесь появится то, что пришлют другие роли.</div>'}
function SXV(){const S=sxS(),ch=sxCollect(false).length,ib=sxInbox();
 return`${SXC.h1?'<h1>Обмен данными</h1>':''}<p class="sub">Общий чат патруля в Телеграме: вы отправляете свои изменения одним сообщением, остальные принимают его в программе. Данные идут только в ваш чат.</p>
 <div class="card"><div class="bar"><button class="btn" data-act="sxsend">Отправить пакет${ch?' ('+ch+')':''}</button><button class="btn g" data-act="sxrecv">Принять пакет</button></div><p class="mu" style="margin:0">${ch?'Готово к отправке: '+ch+' (изменено с прошлой отправки).':'Новых изменений для отправки нет.'}<br>Эта роль отправляет: ${SXC.sends}.<br>Последняя отправка: ${sxDT(S.tOut)}. Последний приём: ${sxDT(S.tIn)}.</p><button class="btn s g" data-act="sxall" style="margin-top:10px">Отправить всё заново</button></div>${ib}`}
const SXA={
 sxcl:()=>closeM(),sxsend:()=>sxSend(false),sxall:()=>sxSend(true),
 sxrecv:()=>modal(`<h3>Принять пакет</h3><p class="mu" style="margin-top:0">Скопируйте сообщение с пакетом из чата и вставьте сюда.</p><textarea id="sx_t" rows="5" style="width:100%;font-size:13px"></textarea><div class="bar" style="margin:12px 0 0"><button class="btn" style="flex:1" data-act="sxapply">Принять</button><button class="btn g" data-act="sxpaste">Вставить из буфера</button><button class="btn g" data-act="sxcl">Отмена</button></div>`),

 sxpaste:()=>{(navigator.clipboard&&navigator.clipboard.readText?navigator.clipboard.readText():Promise.reject()).then(t=>{$('#sx_t').value=t},()=>toast('Не удалось прочитать буфер: вставьте текст вручную'))},
 sxcopy:()=>{const a=document.createElement('textarea');a.value=SXTXT;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Скопировано')}catch(x){toast('Не удалось скопировать')}a.remove();if(navigator.clipboard)navigator.clipboard.writeText(SXTXT).catch(()=>{})},
 sxshare:()=>{if(navigator.share)navigator.share({text:SXTXT}).catch(()=>{});else A.sxcopy()},
 sxfile:async()=>{const name='patrul_paket_'+today()+'.txt';try{const dl=window.claude&&await window.claude.use('downloads');if(dl)return void await dl.save({filename:name,data:new Blob([SXTXT],{type:'text/plain'})})}catch(x){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([SXTXT],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove()},
 sxou:t=>{const x=sxS().in.ou[t.dataset.k];x.d.st=t.dataset.v;x.lc=1;draw(1);toast('Ответ: '+t.dataset.v+'. Нажмите «Отправить пакет»')},

function sxIEv(d){if(!TYPES[d.type])d={...d,type:'Прочее'};const i=D.events.findIndex(x=>x.k==d.k);if(i>=0)D.events[i]=d;else D.events.push(d);return d}
