<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a43"><meta name="description" content="Рабочий кабинет старшего патруля">
<title>Старший патруля · Патрульная служба</title>
<style>
:root{color-scheme:light;--navy:#102a43;--blue:#176b87;--ink:#152536;--muted:#64748b;--line:#dbe4ec;--bg:#f2f5f8;--card:#fff;--ok:#16764a;--warn:#a45b0a;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.shell{max-width:1180px;margin:auto;padding:22px}.top{background:var(--navy);color:#fff;padding:20px 24px;border-radius:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 12px 28px #102a431c}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a9c7d8;font-weight:750}.top h1{font-size:24px;margin:5px 0}.top p{margin:0;color:#c6d7e2;font-size:13px}.top-actions,.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 13px;font-weight:650}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.dark{background:#ffffff14;border-color:#ffffff40;color:white}.btn.danger{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-top:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;min-width:0;box-shadow:0 3px 12px #102a4308}.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-4{grid-column:span 4}
.card h2{font-size:17px;margin:0 0 4px}.sub,.muted{color:var(--muted);font-size:13px}.sub{margin:0 0 13px}.metric{font-size:26px;font-weight:800;letter-spacing:-.04em}.metric-label{color:var(--muted);font-size:12px;margin-top:2px}.metric-card{display:flex;align-items:center;justify-content:space-between;gap:10px}.metric-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#e8f1f6;color:var(--blue);font-weight:800;font-size:19px}
.notice{padding:12px 14px;border-radius:11px;background:#eef5f8;color:#23445a;border:1px solid #d4e4ed;font-size:13px}.notice.warn{background:#fff7e8;border-color:#f5deb5;color:#854d0e}
.list{display:grid;gap:9px}.person,.equipment,.entry{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:11px;padding:11px 12px}.person-main,.eq-main{min-width:0}.person strong,.eq-main strong{display:block}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid #cbd6e0;border-radius:9px;background:white;color:var(--ink);min-width:0}label{display:grid;gap:5px;font-size:13px;font-weight:650}textarea{min-height:105px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.form-grid .full{grid-column:1/-1}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.pill{display:inline-flex;border-radius:20px;padding:3px 8px;font-size:11px;font-weight:750;background:#edf2f6;color:#4a5c6b}.pill.ok{background:#e7f5ed;color:var(--ok)}.pill.warn{background:#fff4dd;color:var(--warn)}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0 0}.tabs button{border:1px solid #ffffff35;background:transparent;color:#d9e5ec;border-radius:9px;padding:7px 11px;font-weight:650}.tabs button.active{background:#fff;color:var(--navy)}
.panel{display:none}.panel.active{display:block}.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed #cbd6e0;border-radius:10px}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.auth{max-width:430px;width:100%;background:white;padding:27px;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 55px #102a4317}.auth h1{font-size:22px;margin:5px 0}.auth p{color:var(--muted);font-size:13px}.auth form{display:grid;gap:12px;margin-top:16px}.auth .divider{border:0;border-top:1px solid var(--line);margin:19px 0}.auth [data-message]{min-height:20px;color:var(--bad);font-size:13px}.auth .btn{padding:11px}.footer{color:var(--muted);font-size:11px;text-align:center;padding:20px}
@media(max-width:760px){.shell{padding:12px}.top{padding:17px;border-radius:14px;align-items:flex-start;flex-direction:column}.top h1{font-size:21px}.grid{gap:10px}.span-8,.span-6,.span-4{grid-column:span 12}.person,.equipment{align-items:flex-start;flex-direction:column}.person .inline,.equipment .inline{width:100%}.person select,.equipment select{flex:1}}
</style></head><body>
<main id="app"><div class="auth-wrap"><section class="auth"><div class="eyebrow">Патрульная служба</div><h1>Старший патруля</h1><p>Вход в личный кабинет своего отделения. Для первого входа создайте собственный PIN-код.</p><div data-message role="alert"></div>
<form data-login><label>Фамилия<input name="surname" autocomplete="family-name" maxlength="80" required placeholder="Введите фамилию"></label><label>PIN-код<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="current-password" required placeholder="6 цифр"></label><button class="btn primary" type="submit">Войти</button></form>
<hr class="divider"><form data-enroll><strong>Первый вход</strong><label>Фамилия<input name="surname" autocomplete="family-name" maxlength="80" required placeholder="Как указано в личном составе"></label><label>Одноразовый код активации<input name="activationCode" inputmode="numeric" pattern="[0-9]{8}" minlength="8" maxlength="8" autocomplete="one-time-code" required placeholder="8 цифр от руководителя"></label><p class="sub">Код выдаёт начальник, заместитель, документовед или мастер. Он действует 30 минут и используется один раз.</p><label>Создайте PIN-код<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="new-password" required placeholder="Придумайте 6 цифр"></label><label>Повторите PIN-код<input name="confirmPin" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="new-password" required placeholder="Повторите 6 цифр"></label><button class="btn" type="submit">Создать PIN и войти</button></form></section></div></main>
