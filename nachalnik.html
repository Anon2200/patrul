function imCalc(j){const items=j.items||[],ops=j.ops||[],set=j.set||{},BAD=['Требует ремонта','В ремонте','Неисправно'],GONE=['Утеряно','Списано'],td=today();

Object.assign(A,SXA);
function sxIEv(d){if(!TYPES[d.type])d={...d,type:'Прочее'};const i=D.events.findIndex(x=>x.k==d.k);if(i>=0)D.events[i]=d;else D.events.push(d);return d}
function sxITk(d){const i=D.tasks.findIndex(x=>x.k==d.k);if(i>=0)D.tasks[i]=d;else D.tasks.push(d);return d}
function sxISt(d){let i=D.staff.findIndex(x=>x.k==d.k);if(i<0)i=D.staff.findIndex(x=>x.name==d.name);if(i>=0){D.staff[i]={...d,k:D.staff[i].k};return D.staff[i]}D.staff.push(d);return d}
IC.sx='<path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/>';

/* ===== ОБЩЕЕ: первый запуск, защита, крупный текст ===== */
const cmLS={g(k){try{return localStorage.getItem(k)}catch(x){return null}},s(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(x){}}};
const cmH=s=>{let h=2166136261;s='patrul:'+s;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16)};
const cmK=n=>KEY+'_'+n;
function cmZoom(){const z=parseFloat(cmLS.g(cmK('zoom'))||'1');document.documentElement.style.zoom=z==1?'':z}
function cmFirst(){if(D.set.init||document.getElementById('cm_n'))return;const c=CMC,f=(k,l,ph)=>`<div class="w"><label>${l}</label><input id="cm_${k}" value="${e(D.set[k]||'')}" placeholder="${ph||''}"></div>`;
 modal(`<h3>Первый запуск: кто вы?</h3><p class="mu" style="margin-top:0">Роль: <b>${c.title}</b>. Эти данные нужны для подписей в документах. Всё хранится только на этом устройстве, потом можно изменить в «Настройках».</p><div class="fg"><div class="w"><label>${c.nameLabel}</label><input id="cm_n" value="${e(D.set[c.nameKey]||'')}" placeholder="Фамилия И.О."></div>${(c.others||[]).map(o=>f(o[0],o[1],o[2])).join('')}</div><div class="bar" style="margin:14px 0 0"><button class="btn" style="flex:1" data-act="cmfirst">Готово</button></div>`);const o=document.querySelector('.ov');if(o)o.removeAttribute('data-act')}
function cmLockShow(){if(document.getElementById('cmlock'))return;const d=document.createElement('div');d.id='cmlock';d.style.cssText='position:fixed;inset:0;z-index:99;background:var(--bg,#eef1f6);display:flex;align-items:center;justify-content:center;padding:20px';d.innerHTML='<div style="background:var(--card,#fff);color:var(--tx,#1a2433);border:1px solid var(--bd,#dbe2ec);border-radius:16px;padding:24px;width:min(340px,100%);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2)"><h3 style="margin:0 0 6px">Программа заблокирована</h3><p style="margin:0 0 14px;opacity:.7;font-size:14px">Введите ПИН-код</p><input id="cm_pin" type="password" inputmode="numeric" autocomplete="off" style="width:100%;text-align:center;font-size:24px;letter-spacing:6px;box-sizing:border-box"><div id="cm_err" style="color:#c0463f;min-height:20px;margin:6px 0;font-size:14px"></div><button id="cm_ok" class="btn" style="width:100%">Открыть</button></div>';document.body.appendChild(d);
 const go=()=>{if(cmH($('#cm_pin').value)==cmLS.g(cmK('pin'))){d.remove();cmLS.s(cmK('last'),String(Date.now()))}else{$('#cm_err').textContent='Неверный ПИН-код';$('#cm_pin').value=''}};$('#cm_ok').onclick=go;$('#cm_pin').onkeydown=e=>{if(e.key=='Enter')go()};setTimeout(()=>$('#cm_pin').focus(),50)}
function cmLockCheck(force){if(!cmLS.g(cmK('pin')))return;const mins=parseInt(cmLS.g(cmK('lockmin'))||'5'),last=parseInt(cmLS.g(cmK('last'))||'0');if(force||mins==0||Date.now()-last>mins*60000)cmLockShow()}
function cmCard(){const pin=!!cmLS.g(cmK('pin')),zm=cmLS.g(cmK('zoom'))||'1',lm=cmLS.g(cmK('lockmin'))||'5';
 return`<div class="card" style="margin-top:14px"><h3>Защита и вид (только на этом устройстве)</h3><p class="mu" style="margin-top:0">ПИН-код защищает от случайного просмотра чужим человеком, а не от взлома. Данные студентов лучше не оставлять на разблокированном телефоне.</p><div class="bar"><button class="btn" data-act="cmpin">${pin?'Сменить ПИН-код':'Поставить ПИН-код'}</button>${pin?'<button class="btn g" data-act="cmpinrm">Снять ПИН-код</button><button class="btn g" data-act="cmlock">Заблокировать сейчас</button>':''}</div>
 ${pin?`<div class="fg"><div class="w"><label>Блокировать при возврате в программу</label><select data-cm="lockmin">${[[0,'Всегда'],[1,'Через 1 минуту'],[5,'Через 5 минут'],[15,'Через 15 минут'],[60,'Через час']].map(x=>`<option value="${x[0]}" ${lm==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div></div>`:''}
 <div class="fg"><div class="w"><label>Размер текста</label><select data-cm="zoom">${[['1','Обычный'],['1.15','Крупный'],['1.3','Очень крупный']].map(x=>`<option value="${x[0]}" ${zm==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div></div></div>`}
const CMA={
 cmfirst:()=>{const c=CMC,n=$('#cm_n').value.trim();if(!n)return toast('Впишите ваше ФИО');D.set[c.nameKey]=n;(c.others||[]).forEach(o=>{const el=$('#cm_'+o[0]);if(el)D.set[o[0]]=el.value.trim()});D.set.init=1;
  if(Array.isArray(D.staff)){const add=(name,pos)=>{if(name&&!D.staff.some(x=>x.name==name))D.staff.push({k:uid(),name,pos,grp:'',tel:'',st:'в строю'})};add(n,c.staffPos);if(D.set.boss&&c.role!='nach')add(D.set.boss,'Начальник патруля')}
  save();closeM();draw();toast('Готово, данные сохранены')},
 cmpin:()=>modal(`<h3>ПИН-код</h3><div class="fg"><div class="w"><label>Новый ПИН-код (4–8 цифр)</label><input id="cm_p1" type="password" inputmode="numeric" autocomplete="off"></div><div class="w"><label>Повторите</label><input id="cm_p2" type="password" inputmode="numeric" autocomplete="off"></div></div><div class="bar" style="margin:14px 0 0"><button class="btn" style="flex:1" data-act="cmpin2">Сохранить</button><button class="btn g" data-act="cl">Отмена</button></div>`),
 cmpin2:()=>{const a=$('#cm_p1').value,b=$('#cm_p2').value;if(!/^\d{4,8}$/.test(a))return toast('ПИН-код: от 4 до 8 цифр');if(a!=b)return toast('ПИН-коды не совпадают');cmLS.s(cmK('pin'),cmH(a));cmLS.s(cmK('last'),String(Date.now()));closeM();draw(1);toast('ПИН-код установлен. Запомните его: восстановить нельзя')},
 cmpinrm:()=>{cmLS.s(cmK('pin'),null);draw(1);toast('ПИН-код снят')},cmlock:()=>cmLockCheck(true)};
Object.assign(A,CMA);if(!A.cl)A.cl=()=>closeM();
document.addEventListener('change',ev=>{const t=ev.target,c=t.dataset&&t.dataset.cm;if(!c)return;cmLS.s(cmK(c),t.value);if(c=='zoom')cmZoom();toast('Сохранено')});
document.addEventListener('visibilitychange',()=>{if(document.hidden)cmLS.s(cmK('last'),String(Date.now()));else cmLockCheck(false)});
stt=(function(_s){return function(){return _s()+cmCard()}})(stt);
cmZoom();cmLockCheck(false);


draw();cmFirst();
