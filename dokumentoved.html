function cmLockCheck(force){if(!cmLS.g(cmK('pin')))return;const mins=parseInt(cmLS.g(cmK('lockmin'))||'5'),last=parseInt(cmLS.g(cmK('last'))||'0');if(force||mins==0||Date.now()-last>mins*60000)cmLockShow()}
function cmCard(){const pin=!!cmLS.g(cmK('pin')),zm=cmLS.g(cmK('zoom'))||'1',lm=cmLS.g(cmK('lockmin'))||'5';
 return`<div class="card" style="margin-top:14px"><h3>Защита и вид (только на этом устройстве)</h3><p class="mu" style="margin-top:0">ПИН-код защищает от случайного просмотра чужим человеком, а не от взлома. Данные студентов лучше не оставлять на разблокированном телефоне.</p><div class="bar"><button class="btn" data-act="cmpin">${pin?'Сменить ПИН-код':'Поставить ПИН-код'}</button>${pin?'<button class="btn g" data-act="cmpinrm">Снять ПИН-код</button><button class="btn g" data-act="cmlock">Заблокировать сейчас</button>':''}</div>
 ${pin?`<div class="fg"><div class="w"><label>Блокировать при возврате в программу</label><select data-cm="lockmin">${[[0,'Всегда'],[1,'Через 1 минуту'],[5,'Через 5 минут'],[15,'Через 15 минут'],[60,'Через час']].map(x=>`<option value="${x[0]}" ${lm==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div></div>`:''}
 <div class="fg"><div class="w"><label>Размер текста</label><select data-cm="zoom">${[['1','Обычный'],['1.15','Крупный'],['1.3','Очень крупный']].map(x=>`<option value="${x[0]}" ${zm==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div></div></div>`}
const CMA={
 cmfirst:()=>{const c=CMC,n=$('#cm_n').value.trim();if(!n)return toast('Впишите ваше ФИО');D.set[c.nameKey]=n;(c.others||[]).forEach(o=>{const el=$('#cm_'+o[0]);if(el)D.set[o[0]]=el.value.trim()});D.set.init=1;
  if(Array.isArray(D.staff)){const add=(name,pos)=>{if(name&&!D.staff.some(x=>x.name==name))D.staff.push({k:uid(),name,pos,grp:'',tel:'',st:'в строю'})};add(n,c.staffPos);if(D.set.boss&&c.role!='nach')add(D.set.boss,'Начальник патруля')}
  save();closeM();draw();toast('Готово, данные сохранены')},
 cmpin:()=>modal(`<h3>ПИН-код</h3><div class="fg"><div class="w"><label>Новый ПИН-код (4–8 цифр)</label><input id="cm_p1" type="password" inputmode="numeric" autocomplete="off"></div><div class="w"><label>Повторите</label><input id="cm_p2" type="password" inputmode="numeric" autocomplete="off"></div></div><div class="bar" style="margin:14px 0 0"><button class="btn" style="flex:1" data-act="cmpin2">Сохранить</button><button class="btn g" data-act="cl">Отмена</button></div>`),
 cmpin2:()=>{const a=$('#cm_p1').value,b=$('#cm_p2').value;if(!/^\d{4,8}$/.test(a))return toast('ПИН-код: от 4 до 8 цифр');if(a!=b)return toast('ПИН-коды не совпадают');cmLS.s(cmK('pin'),cmH(a));cmLS.s(cmK('last'),String(Date.now()));closeM();draw(1);toast('ПИН-код установлен. Запомните его: восстановить нельзя')},
 cmpinrm:()=>{cmLS.s(cmK('pin'),null);draw(1);toast('ПИН-код снят')},cmlock:()=>cmLockCheck(true)};
Object.assign(A,CMA);if(!A.cl)A.cl=()=>closeM();
document.addEventListener('change',ev=>{const t=ev.target,c=t.dataset&&t.dataset.cm;if(!c)return;cmLS.s(cmK(c),t.value);if(c=='zoom')cmZoom();toast('Сохранено')});
document.addEventListener('visibilitychange',()=>{if(document.hidden)cmLS.s(cmK('last'),String(Date.now()));else cmLockCheck(false)});
stt=(function(_s){return function(){return _s()+cmCard()}})(stt);
cmZoom();cmLockCheck(false);


draw();cmFirst();
</script></body></html>
