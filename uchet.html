 if(pw){if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),pl=new Uint8Array(body.length+1);pl[0]=useZ?1:0;pl.set(body,1);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await sxKey(pw,salt),pl)),out=new Uint8Array(28+ct.length);out.set(salt,0);out.set(iv,16);out.set(ct,28);return'ПАТРУЛЬ1E:'+sxB64(out)}
 return useZ?'ПАТРУЛЬ1Z:'+sxB64(z):'ПАТРУЛЬ1R:'+sxB64(raw)}

 if(m[1]=='E'){const pw=sxS().pw;if(!pw)throw new Error('needpw');let pl;try{pl=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},await sxKey(pw,b.slice(0,16)),b.slice(28)))}catch(x){throw new Error('badpw')}z=pl[0]==1;b=pl.slice(1)}
 if(z)b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());return JSON.parse(new TextDecoder().decode(b))}
